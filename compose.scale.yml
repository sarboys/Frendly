name: frendly-backend

# Scale deploy runtime:
# RUNTIME_SERVICES=api_a api_b api_c api_d api_e api_f api_g api_h chat_a chat_b chat_c chat_d worker_realtime worker_content worker_schedules landing admin_internal admin_partner
# Do not include base api, chat or worker in scale mode.

services:
  api_a:
    extends:
      file: compose.prod.yml
      service: api
    environment:
      METRICS_SERVICE_NAME: api_a

  api_b:
    extends:
      file: compose.prod.yml
      service: api
    environment:
      METRICS_SERVICE_NAME: api_b

  api_c:
    extends:
      file: compose.prod.yml
      service: api
    environment:
      METRICS_SERVICE_NAME: api_c

  api_d:
    extends:
      file: compose.prod.yml
      service: api
    environment:
      METRICS_SERVICE_NAME: api_d

  api_e:
    extends:
      file: compose.prod.yml
      service: api
    environment:
      METRICS_SERVICE_NAME: api_e

  api_f:
    extends:
      file: compose.prod.yml
      service: api
    environment:
      METRICS_SERVICE_NAME: api_f

  api_g:
    extends:
      file: compose.prod.yml
      service: api
    environment:
      METRICS_SERVICE_NAME: api_g

  api_h:
    extends:
      file: compose.prod.yml
      service: api
    environment:
      METRICS_SERVICE_NAME: api_h

  chat_a:
    extends:
      file: compose.prod.yml
      service: chat
    environment:
      METRICS_SERVICE_NAME: chat_a

  chat_b:
    extends:
      file: compose.prod.yml
      service: chat
    environment:
      METRICS_SERVICE_NAME: chat_b

  chat_c:
    extends:
      file: compose.prod.yml
      service: chat
    environment:
      METRICS_SERVICE_NAME: chat_c

  chat_d:
    extends:
      file: compose.prod.yml
      service: chat
    environment:
      METRICS_SERVICE_NAME: chat_d

  worker_realtime:
    extends:
      file: compose.prod.yml
      service: worker
    environment:
      METRICS_SERVICE_NAME: worker_realtime
      WORKER_OUTBOX_ENABLED: "true"
      MEDIA_VARIANT_BACKFILL_ENABLED: "true"
      WORKER_CONTENT_ENABLED: "false"
      WORKER_SCHEDULES_ENABLED: "false"
      CONTENT_IMPORT_ENABLED: "false"
      CONTENT_IMPORT_IMAGE_BACKFILL_ENABLED: "false"
      CONTENT_ROUTE_GENERATION_ENABLED: "false"
      WORKER_RETENTION_CLEANUP_ENABLED: "false"

  worker_content:
    extends:
      file: compose.prod.yml
      service: worker
    environment:
      METRICS_SERVICE_NAME: worker_content
      WORKER_OUTBOX_ENABLED: "false"
      WORKER_CONTENT_ENABLED: "true"
      WORKER_SCHEDULES_ENABLED: "false"

  worker_schedules:
    extends:
      file: compose.prod.yml
      service: worker
    environment:
      METRICS_SERVICE_NAME: worker_schedules
      WORKER_OUTBOX_ENABLED: "false"
      WORKER_CONTENT_ENABLED: "false"
      WORKER_SCHEDULES_ENABLED: "true"
      CONTENT_IMPORT_ENABLED: "false"
      CONTENT_IMPORT_IMAGE_BACKFILL_ENABLED: "false"
      CONTENT_ROUTE_GENERATION_ENABLED: "false"

  nginx:
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    depends_on:
      api_a:
        condition: service_healthy
      api_b:
        condition: service_healthy
      api_c:
        condition: service_healthy
      api_d:
        condition: service_healthy
      api_e:
        condition: service_healthy
      api_f:
        condition: service_healthy
      api_g:
        condition: service_healthy
      api_h:
        condition: service_healthy
      chat_a:
        condition: service_healthy
      chat_b:
        condition: service_healthy
      chat_c:
        condition: service_healthy
      chat_d:
        condition: service_healthy
      landing:
        condition: service_healthy
      admin_internal:
        condition: service_healthy
      admin_partner:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/nginx.scale.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/frendly.scale.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

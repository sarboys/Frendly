upstream api_backend {
  least_conn;
  server api_a:3000 max_fails=3 fail_timeout=10s;
  server api_b:3000 max_fails=3 fail_timeout=10s;
  server api_c:3000 max_fails=3 fail_timeout=10s;
  server api_d:3000 max_fails=3 fail_timeout=10s;
  server api_e:3000 max_fails=3 fail_timeout=10s;
  server api_f:3000 max_fails=3 fail_timeout=10s;
  server api_g:3000 max_fails=3 fail_timeout=10s;
  server api_h:3000 max_fails=3 fail_timeout=10s;
  keepalive 768;
}

upstream chat_backend {
  least_conn;
  server chat_a:3001 max_fails=3 fail_timeout=10s;
  server chat_b:3001 max_fails=3 fail_timeout=10s;
  server chat_c:3001 max_fails=3 fail_timeout=10s;
  server chat_d:3001 max_fails=3 fail_timeout=10s;
  server chat_e:3001 max_fails=3 fail_timeout=10s;
  server chat_f:3001 max_fails=3 fail_timeout=10s;
  server chat_g:3001 max_fails=3 fail_timeout=10s;
  server chat_h:3001 max_fails=3 fail_timeout=10s;
  keepalive 256;
}

limit_req_zone $binary_remote_addr zone=api_ip:20m rate=50r/s;
limit_req_zone $binary_remote_addr zone=events_ip:20m rate=2000r/s;

upstream landing_frontend {
  server landing:80;
}

upstream admin_internal_frontend {
  server admin_internal:80;
}

upstream admin_partner_frontend {
  server admin_partner:80;
}

server {
  listen 80 default_server;
  server_name api.frendly.tech _;

  access_log off;
  client_max_body_size 32m;
  gzip off;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types application/json application/problem+json text/plain text/css application/javascript;

  location /ws {
    proxy_pass http://chat_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
  }

  location = /metrics {
    return 404;
  }

  location = /events {
    limit_req zone=events_ip burst=3000 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location / {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }
}

server {
  listen 80;
  server_name admin.frendly.tech partner.frendly.tech;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name api.frendly.tech;

  access_log off;
  ssl_certificate /etc/letsencrypt/live/api.frendly.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.frendly.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 32m;
  gzip off;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types application/json application/problem+json text/plain text/css application/javascript;

  location /ws {
    proxy_pass http://chat_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
  }

  location = /metrics {
    return 404;
  }

  location = /events {
    limit_req zone=events_ip burst=3000 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location / {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }
}

server {
  listen 443 ssl;
  server_name admin.frendly.tech;

  ssl_certificate /etc/letsencrypt/live/admin.frendly.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.frendly.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 32m;

  location = /robots.txt {
    add_header Content-Type text/plain;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location / {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://admin_internal_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}


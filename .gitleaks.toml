title = "Frendly Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore historical false positives in removed AI security checklist examples"
targetRules = ["generic-api-key"]
paths = [
  '''^\.codex/skills/aif-security-checklist/SKILL\.md$''',
  '''^\.opencode/skills/aif-security-checklist/SKILL\.md$''',
]

[[allowlists]]
description = "Ignore historical Podfile.lock checksum false positives from reverted mobile2 import"
targetRules = ["generic-api-key"]
paths = [
  '''^mobile2/ios/Podfile\.lock$''',
  '''^mobile2/macos/Podfile\.lock$''',
]
